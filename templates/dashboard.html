<!DOCTYPE html>
<html>
<head>
  <title>Exam Setup - SASTRA Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
  <h2>Exam Hall Setup</h2>

  <form method="POST">

    <input type="date" name="exam_date" required>

    <input type="text" name="hall" placeholder="Hall Number (Eg: A201)" required>

    <!-- SUBJECT DROPDOWN -->
    <select name="subject_code" required>
      <option value="">Select Subject</option>
      {% for code, sub in subjects.items() %}
        <option value="{{ code }}">{{ sub.name }} ({{ code }}) - Slot {{ sub.slot }}</option>
      {% endfor %}
    </select>

    <input type="text" name="staff_name" placeholder="Staff Name" required>
    <input type="text" name="staff_id" placeholder="Staff ID" required>

    <button type="submit">Generate Attendance Sheet</button>
  </form>

  <div class="action-buttons">
    <a href="/logout"><button type="button">Logout</button></a>
  </div>
</div>

</body>
</html>
