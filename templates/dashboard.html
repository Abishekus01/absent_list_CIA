<!DOCTYPE html>
<html>
<head>
  <title>Exam Setup</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
  <h2>Exam Hall Setup</h2>

  <form method="POST">
    <input type="date" name="exam_date" required>
    <input type="text" name="hall" placeholder="Hall Number" required>

    <select name="slot">
      <option value="9:15 - 10:45">Slot 1 (9:15)</option>
      <option value="11:15 - 12:45">Slot 2 (11:15)</option>
      <option value="1:15 - 2:45">Slot 3 (1:15)</option>
      <option value="3:15 - 4:45">Slot 4 (3:15)</option>
    </select>

    <input type="text" name="subject" placeholder="Subject Name" required>
    <input type="text" name="subject_code" placeholder="Subject Code (e.g. CSE401)" required>

    <input type="text" name="staff_name" placeholder="Staff Name" required>
    <input type="text" name="staff_id" placeholder="Staff ID" required>

    <button type="submit">Generate Attendance Sheet</button>
  </form>

  <a href="/logout"><button>Logout</button></a>
</div>
</body>
</html>
