<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
</head>
<body>

<h2>Dashboard</h2>

{% if not data_loaded %}
  <p style="color:red;">⚠ Upload Master Excel first</p>
  <a href="{{ url_for('upload_master') }}">
    <button>Upload Master Sheet</button>
  </a>
{% else %}

  <p style="color:green;">✔ Master sheet loaded</p>

  <form action="{{ url_for('hall_allocation') }}" method="post">

    <label>Hall Number:</label>
    <input type="text" name="hall" required><br><br>

    <label>Exam Date:</label>
    <input type="date" name="date" required><br><br>

    <label>Slot:</label>
    <select name="slot" required>
      <option value="9:15">9:15</option>
      <option value="11:15">11:15</option>
      <option value="1:15">1:15</option>
      <option value="3:15">3:15</option>
    </select><br><br>

    <label>Select Subject:</label>
    <select name="subject" required>
      {% if subjects %}
        {% for sub in subjects %}
          <option value="{{ sub }}">{{ sub }}</option>
        {% endfor %}
      {% else %}
        <option>No subjects found</option>
      {% endif %}
    </select><br><br>

    <button type="submit">Generate Hall Plan</button>

  </form>

{% endif %}

</body>
</html>
