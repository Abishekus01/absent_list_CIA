<!DOCTYPE html>
<html>
<head>
  <title>Attendance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h2>Exam Attendance Sheet</h2>

<p><b>Hall:</b> {{ data.hall }}</p>
<p><b>Date:</b> {{ data.exam_date }}</p>
<p><b>Slot:</b> {{ data.slot }}</p>

<form method="post">

<table border="1">
  <tr>
    {% for col in columns %}
      <th>{{ col }}</th>
    {% endfor %}
    <th>Absent</th>
  </tr>

  {% for row in tables %}
  <tr>
    {% for col in columns %}
      <td>{{ row[col] }}</td>
    {% endfor %}
    <td>
      <input type="checkbox" name="present_{{ loop.index0 }}" value="A">
    </td>
  </tr>
  {% endfor %}
</table>

<br>
<button type="submit">Save Attendance</button>

</form>

<br>

<a href="{{ url_for('download_absent') }}">
  <button>Download Absent XLSX</button>
</a>

<br><br>

<a href="{{ url_for('dashboard') }}">
  <button>Back to Dashboard</button>
</a>

</body>
</html>
